<!DOCTYPE html>
<html>
  <head>
    <title>Your Discord Kitten</title>
    <meta name="description" content="A cool thing made with Glitch">
    <link id="favicon" rel="icon" href="https://glitch.com/edit/favicon-app.ico" type="image/x-icon">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>
        This is your Discord Kitten
      </h1>
    </header>

    <main>
      <!-- Left panel: main pet image that swaps based on happiness. -->
      <section class="pet-image-container">
         <!-- Replaced pet image with my own pet image -->
        <img class="pet-image" src="images/kitten.png" alt="A discord kitten">
      </section>
      <!-- Right panel: live stats and action buttons. -->
      <section class="dashboard">
        <div>Name: <strong><span class="name"></span></strong></div>
        <div>Weight: <strong><span class="weight"></span> pounds</strong></div>
        <div>Happiness: <strong><span class="happiness"></span> tail wags (per min)</strong></div>
        <div>Distance: <strong><span class="distance"></span> feet away</strong></div>

        <!-- Action controls connected to jQuery click handlers in script.js/script.ts. -->
        <div class="button-container">
          <button class="treat-button">
            Treat
          </button>
          <button class="play-button">
            Play
          </button>
          <button class="exercise-button">
            Exercise
          </button>
          <button class="call-button">
            Call
          </button>
        </div>
      </section>

      <!-- Chrome DevTools Examples Section -->
      <section class="devtools-section">
        <h2>🛠️ Chrome DevTools Examples (Open DevTools with F12)</h2>
        
        <!-- Message Logging Section -->
        <div class="devtools-category">
          <h3>📋 Message Logging Examples</h3>
          <button class="devtools-log-info">Log Info</button>
          <button class="devtools-log-warning">Log Warning</button>
          <button class="devtools-log-error">Log Error</button>
          <button class="devtools-log-table">Log Table</button>
          <button class="devtools-log-group">Log Group</button>
          <button class="devtools-log-custom">Log Custom (Styled)</button>
        </div>

        <!-- Network & Runtime Errors Section -->
        <div class="devtools-category">
          <h3>🔍 View Browser Messages & Errors</h3>
          <button class="devtools-cause-404">Cause 404 Error</button>
          <button class="devtools-cause-typeerror">Cause TypeError</button>
          <button class="devtools-cause-violation">Cause Performance Violation</button>
        </div>

        <!-- Filter Messages Section -->
        <div class="devtools-category">
          <h3>🔎 Filter Messages</h3>
          <button class="devtools-message-sources">Show Message Sources</button>
          <button class="devtools-filter-text">Filter by Text Example</button>
          <button class="devtools-filter-regex">Filter by Regex Example</button>
          <button class="devtools-filter-user-messages">Filter by User Messages</button>
        </div>

        <!-- Debugging Section -->
        <div class="devtools-category">
          <h3>🐛 Debugging & Breakpoints</h3>
          <button class="devtools-reproduce-bug">Reproduce Bug (Division by Zero)</button>
          <button class="devtools-variable-inspection">Variable Inspection</button>
          <button class="devtools-watch-expressions">Watch Expressions Example</button>
          <button class="devtools-pause-exception">Pause on Exception</button>
          <button class="devtools-pause-breakpoint">Pause with Breakpoint</button>
          <button class="devtools-step-through">Step Through Code</button>
          <button class="devtools-apply-fix">Apply Fix</button>
        </div>
      </section>
    </main>

    <!-- Your web-app is https, so your scripts need to be too -->
    <script src="https://code.jquery.com/jquery-2.2.1.min.js"
            integrity="sha256-gvQgAFzTH6trSrAWoH1iPo9Xc96QxSZ3feW6kem+O00="
            crossorigin="anonymous"></script>
  </body>
</html>
